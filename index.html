        let currentPage = 0;
        const poemsPerPage = 6;

        function renderPoemList() {
            const listElement = document.getElementById('poem-list');
            listElement.innerHTML = '';

            const start = currentPage * poemsPerPage;
            const end = start + poemsPerPage;
            const currentPoems = poems.slice(start, end);

            currentPoems.forEach(poem => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="#" onclick="showPoem('${poem.id}')">${poem.title}</a>`;
                listElement.appendChild(li);
            });

            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const totalPages = Math.ceil(poems.length / poemsPerPage);

            // Кнопка «Назад» скрыта только на 1-й странице (индекс 0)
            if (currentPage === 0) {
                prevBtn.classList.add('hidden');
            } else {
                prevBtn.classList.remove('hidden');
            }

            // Кнопка «Дальше» скрыта только на последней (4-й) странице
            if (currentPage >= totalPages - 1) {
                nextBtn.classList.add('hidden');
            } else {
                nextBtn.classList.remove('hidden');
            }
        }

        function changePage(direction) {
            currentPage += direction;
            renderPoemList();
        }

        function showPoem(id) {
            const poem = poems.find(p => p.id === id);
            if (poem) {
                document.getElementById('poem-title').innerText = poem.title;
                document.getElementById('poem-text').innerText = poem.text;
                document.getElementById('main-page').classList.add('hidden');
                document.getElementById('poem-page').classList.remove('hidden');
                window.scrollTo(0, 0);
            }
        }

        function showMainPage() {
            document.getElementById('poem-page').classList.add('hidden');
            document.getElementById('main-page').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        renderPoemList();
    </script>
